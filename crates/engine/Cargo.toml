[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit     = "0.20.0"
ash       = "0.29.0"
cgmath    = "0.17.0"
memoffset = "0.5.1"
image     = { version = "0.23", default-features = false, features = ["png"] }
num       = "0.2"
dirs      = "5"
kira      = { version = "0.12", default-features = false, features = ["cpal", "mp3"] }

[dependencies.bitflags]
version = ">= 1.0.4"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.17.0"
cocoa = "0.18.4"
objc  = "0.2.5"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.5", features = ["windef", "libloaderapi"] }
