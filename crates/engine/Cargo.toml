[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Watch shader SPV directories *and* game-side asset directories on disk;
# rebuild built-in material pipelines and swap the GPU bytes / decoded data
# for textures, meshes (OBJ/glTF), and sounds in place when source files
# change. Fonts log "restart required" because re-baking can shift glyph
# metrics out from under already-laid-out text. Dev iteration only; off in
# release builds (the `asset!` macro then expands to `include_bytes!` and the
# binary carries every asset baked in, with zero runtime watcher overhead).
hot-reload = ["dep:notify"]
# Wavefront OBJ mesh loader (Resources::load_obj / load_obj_data).
obj = ["dep:tobj"]
# glTF 2.0 mesh loader, GLB-only (Resources::load_gltf / load_gltf_data).
gltf = ["dep:gltf"]

[dependencies]
winit             = "0.30"
ash               = "0.38"
ash-window        = "0.13"
raw-window-handle = "0.6"
glam              = "0.32"
memoffset         = "0.5.1"
image             = { version = "0.23", default-features = false, features = ["png"] }
num               = "0.2"
dirs              = "5"
kira              = { version = "0.12", default-features = false, features = ["cpal", "mp3"] }
fontdue           = "0.7"
notify            = { version = "6", optional = true }
tobj              = { version = "4", optional = true, default-features = false }
gltf              = { version = "1", optional = true, default-features = false, features = ["utils"] }

[dependencies.bitflags]
version = ">= 1.0.4"
