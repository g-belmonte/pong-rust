[package]
name = "test-3d"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Proxy features: turn on the matching engine loader.
obj  = ["engine/obj"]
gltf = ["engine/gltf"]
# Shader + asset hot-reload during dev iteration. Mostly useful here with
# `--features obj,hot-reload` to test cube.obj edits.
hot-reload = ["engine/hot-reload"]

[dependencies]
engine = { path = "../engine" }
