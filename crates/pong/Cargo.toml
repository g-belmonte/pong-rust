[package]
name = "pong"
version = "0.1.0"
edition = "2018"

[features]
default = []
# Proxy feature: turning this on enables shader *and* asset hot-reload in
# the engine. Run `cargo run -p pong --features hot-reload` during dev
# iteration on shaders or non-shader assets (textures, sounds, fonts under
# `crates/pong/assets/`). Off by default; release builds bake every asset
# in via `engine::asset!` → `include_bytes!`.
hot-reload = ["engine/hot-reload"]

[dependencies]
engine     = { path = "../engine" }
num        = "0.2"
rand       = "0.8.5"
# Settings persistence: JSON at `dirs::config_dir()/pong-rust/settings.json`.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dirs       = "5"
